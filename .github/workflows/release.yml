name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: '*.tgz'

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/announcer-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+, which Node 24 ships with.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: package
      - run: npm publish ./*.tgz
